<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Key Generator</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3a7bd5, #3a6073);
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }
    button {
      background-color: #00c6ff;
      border: none;
      color: white;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      margin: 8px;
    }
    button:hover {
      background-color: #0072ff;
      transform: scale(1.05);
    }
    #apikeyDisplay {
      margin-top: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1.1rem;
      word-break: break-all;
      min-width: 280px;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <h1>API Key Generator</h1>
  <p>Klik tombol di bawah untuk menampilkan atau membuat API key baru</p>

  <div>
    <button id="showKeyBtn">🔍 Lihat API Key</button>
    <button id="generateBtn">🔁 Buat API Key Baru</button>
  </div>

  <p id="apikeyDisplay">🔒 API Key belum ditampilkan</p>

  <footer>© 2025 Apikeya Server</footer>

  <script>
    async function getApiKey() {
      const res = await fetch("/apikey");
      const data = await res.json();
      document.getElementById("apikeyDisplay").innerText = `API Key: ${data.apiKey}`;
    }

    async function createApiKey() {
      const res = await fetch("/create", { method: "POST" });
      const data = await res.json();
      document.getElementById("apikeyDisplay").innerText = `API Key Baru: ${data.apiKey}`;
    }

    document.getElementById("showKeyBtn").addEventListener("click", getApiKey);
    document.getElementById("generateBtn").addEventListener("click", createApiKey);
  </script>
</body>
</html>
